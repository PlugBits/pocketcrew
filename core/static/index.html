<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070a14">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>ポケクル</title>
<style>
  /* ゼロから作り直し(2026-09-22 v2)。env(safe-area-inset-*) を直接書いてよいのはここの2行だけ。
     他は必ず var(--sat)/var(--sab) を使うこと(検証ツールがこの2行にだけ実機相当の値を流し込む) */
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --kb: 0px;
    --bg:#070a14;--fg:#e8ecf5;--sub:#a9b3cc;--dim:#8892b0;--card:#0e1326;--line:#1b2340;--ok:#5fe0b0;--busy:#ffd166;--warn:#ff6b7a;--dead:#556;--acc:#5aa0ff;--c-note:#3987e5;--c-x:#d95926;
    --fs-body:16px;--fs-sub:13px;--fs-small:12px;--fs-title:18px;--fs-h1:22px;--lh:1.6;
    --font-ui:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;--font-mono:Menlo,'SF Mono',ui-monospace,monospace;
    --compose-h:120px;--tcompose-h:120px;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  /* 画面は2つだけ(ホーム/スレ)。この2枚だけが position:fixed;inset:0 を持つ土台 */
  .screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
  .screen.on{display:flex}
  .hdr{flex:none;box-sizing:border-box;padding-top:var(--sat);background:#070a14;border-bottom:1px solid var(--line);z-index:2}
  .hdr-row{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 10px;box-sizing:border-box}
  .hdr .icon{background:transparent;border:0;color:var(--fg);font-size:19px;padding:6px 8px;min-height:40px;min-width:36px;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
  .hdr .icon svg{display:block}
  .hdr-icons{display:flex;align-items:center;gap:2px;flex:none}
  .hdr .ttl{font-weight:600;font-size:var(--fs-sub);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hdr .ttl b{color:#9ec1ff}
  .hdr .sp{flex:1;min-width:0}
  .hdr .t-name{font-weight:600;font-size:var(--fs-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw;flex:none}
  .hdr .t-state{font-size:var(--fs-sub);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box}
  #pulse{position:relative;height:280px;box-sizing:border-box;background:#070c18;flex:none}
  #c{display:block;width:100%;height:100%;pointer-events:none}
  #err{position:fixed;left:12px;right:12px;top:calc(var(--hdr-h, 46px) + 6px);font-size:var(--fs-sub);color:var(--warn);opacity:0;z-index:6;background:rgba(7,10,20,.85);padding:4px 8px;border-radius:8px;white-space:pre-wrap;pointer-events:none}
  #cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .card{background:transparent;border:0;border-radius:0;padding:0;min-width:0;overflow:visible}
  .card.approval,.card.trust,.card.choice,.card.login{background:#120d18}
  .card.dead{opacity:.8}
  .st{font-weight:600}
  .idle .st{color:var(--ok)} .working .st{color:var(--busy)} .approval .st,.trust .st,.choice .st,.login .st{color:var(--warn)}
  #tQuestion{flex:none;margin:0;padding:10px 16px;font-size:var(--fs-sub);line-height:var(--lh);background:#160d1a;border-bottom:1px solid #3a2340;box-sizing:border-box}
  #tQuestion pre{font-family:var(--font-mono);color:var(--warn);white-space:pre-wrap;margin:0 0 6px;max-height:22vh;overflow:auto}
  #tQuestion .hint{color:var(--sub)}
  #tQuestion[hidden]{display:none}
  .qc-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .qc-tab{font-size:var(--fs-small);color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
  .qc-tab.done{color:var(--ok);border-color:var(--ok)}
  .qc-tab.cur{color:var(--fg);border-color:var(--warn);background:rgba(255,107,122,.12)}
  .qc-progress{color:var(--sub);font-size:var(--fs-small);margin-bottom:2px}
  .qc-prompt{color:var(--fg);font-weight:600;margin-bottom:2px}
  .qc-opts button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;flex:1 1 100%}
  .qc-rec{color:var(--ok);font-weight:400}
  .qc-desc{display:block;color:var(--dim);font-size:var(--fs-small);font-weight:400}
  .qc-rv{margin:4px 0;font-size:var(--fs-sub)}
  .qc-rv-q{color:var(--sub)}
  .qc-rv-a{color:var(--fg);font-weight:600}
  .tail{margin-top:8px;padding:0 16px;font-size:var(--fs-sub);line-height:var(--lh);color:var(--sub);font-family:var(--font-mono);white-space:pre-wrap;word-break:break-word;box-sizing:border-box}
  .none{color:var(--sub);font-family:var(--font-ui);font-size:var(--fs-sub)}
  .card.open .tail{max-height:none;color:var(--fg);overflow:visible;padding-bottom:8px}
  /* Main への送信欄(ホーム専用)。#home の内側に置くだけで、スレ画面ではこの要素ごと非表示になる */
  #compose{position:fixed;left:0;right:0;bottom:var(--kb);z-index:5;box-sizing:border-box;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + max(0px, var(--sab) - var(--kb)))}
  #compose .to{font-size:var(--fs-sub);color:var(--dim);margin-bottom:6px}
  #compose .row2,.cardsend .row2{display:flex;gap:8px;align-items:flex-end}
  #compose textarea,.cardsend textarea{width:auto;box-sizing:border-box;min-height:44px;max-height:30vh}
  #homeScroll{padding-bottom:calc(var(--compose-h) + var(--sab) + var(--kb) + 14px)}
  .thread-list{padding:4px 12px 4px;box-sizing:border-box}
  .th-row{display:flex;align-items:center;gap:10px;min-height:56px;box-sizing:border-box;padding:3px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .th-row:last-child{border-bottom:0}
  .th-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .th-name{font-weight:600;font-size:var(--fs-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
  .th-st{flex:1;min-width:0;font-size:var(--fs-sub);color:var(--dim);text-align:right}
  /* スレ画面の送信欄(1つだけ)。カードの一部だが position:fixed で常に画面下に貼り付ける */
  #threadScroll{padding-bottom:calc(var(--tcompose-h) + var(--sab) + var(--kb) + 14px)}
  .cardsend{position:fixed;left:0;right:0;bottom:var(--kb);z-index:5;background:var(--card);border-top:1px solid var(--line);box-sizing:border-box;padding:10px 12px calc(10px + max(0px, var(--sab) - var(--kb)))}
  textarea{box-sizing:border-box;flex:1;min-width:0;background:#0b1020;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:var(--fs-body);font-family:var(--font-ui);line-height:var(--lh);min-height:44px;max-height:30vh;resize:none;outline:none}
  button{box-sizing:border-box;background:#1f2f5e;color:#dfe7ff;border:1px solid #2c3f7a;border-radius:10px;padding:10px 14px;font-size:var(--fs-body);font-family:var(--font-ui);min-height:44px}
  button:disabled{opacity:.4}
  button.pri{background:#2f6fdb;border-color:#4a86ea;color:#fff}
  button:active{transform:translateY(1px) scale(.98);filter:brightness(1.15)}
  .task:active,#summary:active{filter:brightness(1.12)}
  #confirm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
  #confirm.on{display:flex}
  #confirm .sheet{box-sizing:border-box;background:#0e1326;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--sab));width:100%}
  #confirm .to{font-size:var(--fs-sub);color:var(--dim);margin-bottom:8px}
  #confirm .txt{white-space:pre-wrap;font-size:var(--fs-body);line-height:var(--lh);max-height:40vh;overflow:auto;margin-bottom:12px}
  #confirm .btns{display:flex;gap:8px;justify-content:flex-end}
  .chatlog{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:8px;padding:0 16px}
  .chatlog>div{min-width:0}
  .chatlog .me{font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh);background:#1b2a55;color:#dfe7ff;border-radius:12px;padding:8px 12px 8px 30px;justify-self:end;max-width:88%}
  .chatlog .re{font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh);color:var(--fg);background:none;border:0;padding:2px 30px 2px 0;max-width:100%}
  .chatlog .tool{font-family:var(--font-ui);font-size:var(--fs-sub);color:var(--dim);padding:6px 10px;white-space:pre-wrap;word-break:break-word;border-left:2px solid var(--line);border-radius:0 8px 8px 0;background:rgba(255,255,255,.02);cursor:pointer}
  .chatlog .tool .chev{opacity:.6;font-size:var(--fs-small)}
  .chatlog .tool.open{color:var(--sub)}
  .chatlog .tool .full{display:block;margin-top:6px;font-family:var(--font-mono);font-size:var(--fs-sub);line-height:var(--lh);color:var(--sub);white-space:pre-wrap;word-break:break-word}
  .chatlog .re .tool.sumtag{margin:8px 0 0}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .btns button{padding:8px 14px;font-size:var(--fs-sub);min-height:44px}
  .btns button.dim{background:transparent;border-color:var(--line);color:var(--dim)}
  /* #files(vault ビューア)の見た目は rooms/vault/home.css へ移した(段階: vault を公開サンプルの room にする)。
     #blobview は他 room(docs 等)も window.tpBlob 経由で使う汎用オーバーレイなので core に残す。 */
  #blobview{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
  #blobview.on{display:flex}
  #blobview .bv-bar{display:flex;gap:8px;align-items:center;padding:calc(10px + var(--sat)) 12px 10px;border-bottom:1px solid var(--line);background:#0e1326;flex:none;box-sizing:border-box}
  #blobview .bv-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-body);color:var(--fg);font-family:var(--font-ui)}
  #blobview .bv-bar button{min-height:44px;font-size:var(--fs-body);font-family:var(--font-ui);flex:none}
  #blobview .bv-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;box-sizing:border-box}
  #blobview .bv-body iframe,#blobview .bv-body object{width:100%;height:100%;border:0;background:#fff}
  #blobview .bv-body img{max-width:100%;max-height:100%;object-fit:contain;display:block;margin:auto}
  /* ブリーフィング編集オーバーレイ(2026-09-24: prompt() は iPhone で1行しか見えず編集できなかったため全画面に)。
     vault room の #files 同様 .tp-overlay を付けて swipeOverlayOpen() に拾わせる。room 側 CSS には依存しない(vault は任意) */
  #brief{position:fixed;inset:0;background:#0e1326;z-index:30;display:none;flex-direction:column;box-shadow:0 0 0 100vh #0e1326}   /* 影で下にも塗る: キーボード上の半透明の帯の裏にスレ本文が透けていた(2026-09-24 IMG_5880) */
  #brief.on{display:flex}
  #brief .top{display:flex;gap:8px;align-items:center;padding:calc(10px + var(--sat)) 12px 10px;border-bottom:1px solid var(--line);background:#0e1326;flex:none;box-sizing:border-box}
  #brief .top .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-body);color:var(--fg);font-family:var(--font-ui)}
  #brief .top button{min-height:44px;font-size:var(--fs-body);font-family:var(--font-ui);flex:none}
  #brief .hint{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 12px;font-size:var(--fs-sub);color:var(--dim);flex:none;box-sizing:border-box}
  #brief .hint .cnt{flex:none;white-space:nowrap;font-family:var(--font-mono)}
  #brief textarea{flex:1;min-height:0;box-sizing:border-box;margin:0 12px calc(12px + var(--sab));background:#0b1020;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:var(--fs-body);line-height:var(--lh);font-family:var(--font-ui);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;overflow-x:hidden;resize:none;outline:none}
  .attach{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;font-size:var(--fs-small);color:var(--dim)}
  .attach:empty{display:none}
  .attach .chip{position:relative;background:#131a33;border:1px solid var(--line);border-radius:12px;padding:3px 9px;color:var(--fg);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attach .chip b{color:var(--warn);margin-left:6px;cursor:pointer}
  .attach .chip .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);width:0%;border-radius:0 0 12px 12px}
  .attach .chip .pct{color:var(--dim);margin-left:4px}
  .attach .chip.error{border-color:var(--warn);background:rgba(255,107,122,.14)}
  .attach .chip .err{color:var(--warn);margin-left:6px}
  button.clip{padding:8px 10px}
  input[type=file]{display:none}
  #cards{margin-top:10px}
  #cards:empty{display:none}
  .chatlog table{font-family:var(--font-ui);border-collapse:collapse;font-size:14px;width:100%}
  .chatlog th,.chatlog td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;white-space:normal;min-width:80px;line-height:var(--lh)}
  .chatlog th{color:#9ec1ff;font-weight:600;background:#0b1020}
  .chatlog .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2px 0}
  #toast{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--sab));z-index:9;display:none;background:rgba(14,19,38,.96);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:14px;padding:12px 14px;font-size:var(--fs-body);box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #toast.on{display:block}
  #toast.need{border-left-color:var(--warn)} #toast.dead{border-left-color:var(--dead)}
  #toast .t{font-weight:600;margin-bottom:2px} #toast .b{color:var(--sub);font-size:var(--fs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chatlog .me,.chatlog .re,.chatlog .tool,.tail,#tQuestion{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  .chatlog .re,.chatlog .me{position:relative}
  .chatlog .copy{display:block;margin:4px 0 0 auto;font-size:var(--fs-small);opacity:.5;background:transparent;border:0;padding:6px 4px;color:var(--dim)}
  .chatlog a{color:#7fb0ff;word-break:break-all}
  /* ⋯ メニュー(ホーム/スレ共通の下シート) */
  .menu{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
  .menu.on{display:flex}
  .menu .sheet{box-sizing:border-box;background:#0e1326;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 8px calc(8px + var(--sab));width:100%}
  .menu button{display:block;width:100%;box-sizing:border-box;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);color:var(--fg);padding:14px 12px;font-size:var(--fs-body);font-family:var(--font-ui);border-radius:0;min-height:48px}
  .menu button:first-child{border-top:0}
  .menu button.cancel{color:var(--dim);text-align:center;margin-top:6px;border-top:0;border-radius:10px;background:#131a33}
  .menu button.warn{color:var(--warn)}
  #roomWarn{font-size:var(--fs-sub);color:var(--warn);padding:2px 4px 8px}
</style>
</head>
<body>

<!-- ================= 画面1: ホーム ================= -->
<div id="home" class="screen on">
  <div class="hdr" id="homeHdr"><div class="hdr-row">
    <span class="ttl" id="homeTtl"><b>ポケクル</b> · <span id="up">…</span></span><span id="host" hidden></span>
    <span class="sp"></span>
    <div class="hdr-icons">
      <span id="ttsBtn" class="icon" style="cursor:pointer" role="button" tabindex="0"></span>
      <span id="pushBtn" class="icon" style="cursor:pointer" role="button" tabindex="0" title="通知"></span>
      <span id="swUpdate" hidden style="cursor:pointer;font-size:var(--fs-small);color:var(--busy);border:1px solid var(--busy);border-radius:8px;padding:3px 7px">更新あり(タップで再読込)</span>
      <button id="homeMenuBtn" class="icon">⋯</button>
    </div>
  </div></div>
  <div id="homeScroll" class="scroll">
    <div id="roomWarn" hidden></div>
    <div id="pulse">
      <canvas id="c"></canvas>
      <div id="err">offline</div>
    </div>
    <div id="threadList" class="thread-list"></div>
  </div>
  <div id="compose"><div class="sheet"><div class="to"><span id="mainState" class="st"></span></div><div class="attach" data-att-for="main"></div><div class="row2"><textarea id="msg" rows="1" placeholder="Main へ"></textarea><button class="clip" data-att="main">📎</button><button id="sendBtn" class="pri" disabled>送信</button></div><input type="file" id="file-main" accept="image/*,.pdf,.md,.txt,.csv,.json" multiple></div></div>
</div>

<!-- ================= 画面2: スレ ================= -->
<div id="thread" class="screen">
  <div class="hdr"><div class="hdr-row">
    <button id="tBack" class="icon">←</button>
    <span id="tName" class="t-name"></span>
    <span id="tState" class="t-state"></span>
    <span class="sp"></span>
    <button id="threadMenuBtn" class="icon">⋯</button>
  </div></div>
  <div id="tQuestion" hidden></div>
  <div id="threadScroll" class="scroll">
    <div id="cards"></div>
  </div>
</div>

<!-- ================= ⋯ メニュー(ホーム以外への導線はここに集約) ================= -->
<div id="homeMenu" class="menu"><div class="sheet">
  <button data-act="plan">ダッシュボード</button>
  <button data-act="note">note</button>
  <button data-act="workout">🏋️ ワークアウト</button>
  <button data-act="num">📊 数字</button>
  <button data-act="newthread">+ 新しいスレを立てる</button>
  <button class="cancel" data-act="close">閉じる</button>
</div></div>
<div id="threadMenu" class="menu"><div class="sheet">
  <button data-act="brief">起動時ブリーフィングを編集</button>
  <button data-act="restart">再起動</button>
  <button class="warn" data-act="stop">止める</button>
</div></div>

<div id="toast"><div class="t"></div><div class="b"></div></div>
<!-- #files(vault ビューア)の DOM は rooms/vault/home.js が自分で作る(段階: vault を公開サンプルの room にする) -->
<div id="blobview" class="tp-overlay"><div class="bv-bar" id="bv-bar"><span class="bv-title" id="bv-title"></span><button id="bv-share">共有</button><button id="bv-close">閉じる</button></div><div class="bv-body" id="bv-body"></div></div>
<!-- 起動時ブリーフィング編集(全画面。prompt() の置き換え。2026-09-24) -->
<div id="brief" class="tp-overlay">
  <div class="top"><button id="briefBack">←</button><span class="ttl" id="briefTitle"></span><button id="briefSave" class="pri">保存</button></div>
  <div class="hint"><span>スレの起動・再起動(/clear)のときに最初に送る文です。空にして保存すると削除。</span><span class="cnt" id="briefCnt">0 / 4000</span></div>
  <textarea id="briefText" placeholder="起動時ブリーフィング"></textarea>
</div>
<div id="confirm"><div class="sheet"><div class="to">宛先: <b id="cTo"></b> · Enterまで送ります</div><div class="txt" id="cTxt"></div><label style="font-size:var(--fs-sub);color:var(--sub);display:block;margin-bottom:10px"><input type="checkbox" id="cSkip"> 次回から確認せずに送る(この端末だけ)</label><div class="btns"><button id="cNo">やめる</button><button id="cYes" class="pri">送信する</button></div></div></div>
<script>
window.__tp={frames:0,errors:[]};
// room 側(home.js)と core を繋ぐ薄い共有点。room はここに登録・参照するだけで、core の内部実装(DOM構造や
// 変数名)には触れない。詳細は core/rooms.py の docstring(room.json の "home" キー)参照。
//   TP.linkifiers: [(escapedHtml)=>escapedHtml]  チャット本文の linkify() が esc 済み HTML に順に適用する

document.getElementById('tQuestion').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-typed-act]'); if(!b) return;
  const w=b.dataset.w, act=b.dataset.typedAct;
  if(act==='clear'&&!confirm('入力欄に残っている文を消します。送られません。')) return;
  // /api/key ではなく、配達確認つきの専用APIを使う。api() ヘルパーは失敗時に alert() を出すので
  // ここでは使わず、戻り値をそのまま画面(#tQuestion)に出す
  b.disabled=true;
  let j;
  try{
    const r=await fetch(act==='send'?'/api/draft/send':'/api/draft/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({window:w})});
    j=await r.json();
  }catch(err){ j={ok:false,error:'通信に失敗しました'}; }
  if(j.ok&&(j.sent||j.cleared)){
    typedMsg[w]={hideBox:true,text:j.sent?'送りました':'消しました'};
    render(lastData);
    setTimeout(()=>{ if(typedMsg[w]&&typedMsg[w].hideBox){ delete typedMsg[w]; const q=document.getElementById('tQuestion'); if(q) q.hidden=true; } },1500);
  } else if(j.ok){
    typedMsg[w]={note:j.note||''};
    render(lastData);
  } else {
    typedMsg[w]={err:j.error||'失敗しました',left:j.left};
    render(lastData);
  }
  poll();
});

async function startNewThread(){
  const past=(await (await fetch('/api/past',{cache:'no-store'})).json()).past||[];
  let name='';
  if(past.length){const pick=prompt(`立て直すなら番号、新しく作るなら名前を入力:\n${past.map((p,i)=>`${i+1}. ${p.name}(${p.window})${p.auto?' ※再起動時に自動復帰':''}`).join('\n')}`); if(pick===null) return;
    const n=parseInt(pick,10); if(n>=1&&n<=past.length){const j=await api('/api/relaunch',{window:past[n-1].window}); if(j.ok){alert(`${j.name} を立て直しました。以後は再起動でも自動で復帰します`); setTimeout(poll,4000);} return;} name=pick.trim();}
  else {name=(prompt('スレの名前(iPhoneのアプリに出る表示名)')||'').trim();}
  if(!name) return;
  const pr=(await (await fetch('/api/presets')).json()).presets||['なし'];
  const psel=prompt(`雛形を番号で(${pr.map((p,i)=>`${i+1}=${p}`).join(' / ')})`,'1'); if(psel===null) return;
  const preset=pr[Math.max(0,Math.min(pr.length-1,(parseInt(psel,10)||1)-1))];
  const j=await api('/api/new',{name,preset}); if(j.ok){setTimeout(poll,4000);}
}

// 起動時ブリーフィング編集(全画面オーバーレイ。2026-09-24: prompt() は iPhone だと1行しか見えず
// 800字の複数行ブリーフィングが読めない・編集できなかったため置き換え)
const briefEl=document.getElementById('brief'), briefTitleEl=document.getElementById('briefTitle'),
  briefTextEl=document.getElementById('briefText'), briefSaveBtn=document.getElementById('briefSave'),
  briefBackBtn=document.getElementById('briefBack'), briefCntEl=document.getElementById('briefCnt');
let briefWin=null, briefOrig='';
function briefUpdateCnt(){
  const n=briefTextEl.value.length;
  briefCntEl.textContent=n+' / 4000';
  briefCntEl.style.color=n>4000?'var(--warn)':'';
}
function briefDirty(){ return briefTextEl.value!==briefOrig; }
function closeBrief(force){
  if(!force && briefDirty() && !confirm('変更を捨てますか?')) return;
  briefEl.classList.remove('on'); briefEl.style.top=''; briefEl.style.height=''; briefWin=null;
}
// iOS: キーボードが出るとレイアウトビューポートは縮まないので、visualViewport に合わせて
// オーバーレイ自体の高さ(top/height)を実測値へ書き換える(#confirm 用の fitBar() と同じ考え方)
function fitBrief(){
  const vv=window.visualViewport; if(!vv||!briefEl.classList.contains('on')) return;
  briefEl.style.top=vv.offsetTop+'px'; briefEl.style.height=vv.height+'px';
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitBrief); visualViewport.addEventListener('scroll',fitBrief);}

briefSaveBtn.addEventListener('click',async()=>{

  const j=await api('/api/session/brief',{window:briefWin,brief:v});
  if(j.ok){
    briefOrig=v; briefSaveBtn.textContent='保存しました';
    setTimeout(()=>{ closeBrief(true); setTimeout(poll,500); },500);

  }

async function editBrief(w){
  const s=sessions.find(x=>x.window===w);
  briefWin=w; briefOrig=''; briefTitleEl.textContent='ブリーフィング: '+(threadMenuName||(s&&s.name)||w);
  briefTextEl.value=''; briefTextEl.disabled=true; briefSaveBtn.disabled=true; briefSaveBtn.textContent='保存';
  briefUpdateCnt();
  briefEl.classList.add('on'); fitBrief();
  try{
    const cur=(await (await fetch('/api/session/brief?window='+encodeURIComponent(w),{cache:'no-store'})).json()).brief||'';
    if(briefWin!==w) return;   // 待っている間に閉じた/別スレを開いた
    briefOrig=cur; briefTextEl.value=cur; briefUpdateCnt();
  }catch(e){}
  briefTextEl.disabled=false; briefSaveBtn.disabled=false; briefTextEl.focus();
}
async function restartThread(w){

  await api('/api/restart',{window:w,force:false}); setTimeout(poll,3000);
}
// 司令室の中の移動は履歴を積まない(2026-09-24)。積むと、スレから左端スワイプしたときに iOS の
// 「戻る」も同時に動き、前に開いた /plan#tab=num や vault の #f=… に戻っていた。
// ⋯メニューは location.replace、本文中の同一オリジンのリンク(#f= など)はここで replace に替える。
document.addEventListener('click',e=>{
  if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey) return;
  const a=e.target.closest&&e.target.closest('a[href]'); if(!a||a.target||a.hasAttribute('download')) return;
  const h=a.getAttribute('href'); if(!h||h==='#') return;
  let u; try{u=new URL(h,location.href);}catch(_){return;}
  if(u.origin!==location.origin) return;
  e.preventDefault();
  // ハッシュだけ違う(#f= #d= #t= など)ときは replace に頼らない(2026-09-24)。iOS の PWA では
  // location.replace で hashchange が来ないことがあり、vault の md リンクが開かなかった。同じハッシュの
  // 再タップでも開くよう、履歴を書き換えてから hashchange を自分で投げる(受け手は vault/home.js ほか)。
  if(u.pathname===location.pathname&&u.search===location.search&&u.hash){
    const old=location.href; history.replaceState(history.state,'',u.href);
    window.dispatchEvent(new HashChangeEvent('hashchange',{oldURL:old,newURL:u.href})); return;
  }
  location.replace(u.href);
});
homeMenuEl.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act],button[data-href]'); if(!b) return;
  const act=b.dataset.act; closeMenus();
  if(act==='plan') location.replace('/plan');
  else if(act==='note') location.replace('/note');
  else if(act==='workout') location.replace('/workout');
  else if(act==='num') location.replace('/plan#tab=num');
  else if(act==='newthread') startNewThread();
  else if(act&&TP.menuActions[act]) TP.menuActions[act]();   // room 登録分(例: vault の "📁 vault")
  else if(b.dataset.href) location.replace(b.dataset.href);
});
threadMenuEl.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const act=b.dataset.act; closeMenus();
  const w=threadMenuTarget; if(!w) return;
  if(act==='brief') editBrief(w);
  else if(act==='restart') restartThread(w);
  else if(act==='stop') stopThread(w,threadMenuName);
});

// ================= 通知(Web Push) =================
const pushBtn=document.getElementById('pushBtn');
function b64uToU8(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));return Uint8Array.from(b,c=>c.charCodeAt(0));}
async function pushState(){try{const reg=await navigator.serviceWorker?.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription(); pushBtn.innerHTML=sub?ICON_BELL_ON:ICON_BELL_OFF; pushBtn.style.opacity=sub?'1':'.55'; pushBtn.setAttribute('aria-label',sub?'通知 購読中':'通知 未購読'); pushBtn.title=sub?'通知 購読中':'通知 未購読'; return sub;}catch(e){return null;}}
pushBtn.innerHTML=ICON_BELL_OFF; pushBtn.style.opacity='.55';   // register() が呼ばれるまでの初期表示(非対応環境でも空にしない)
const swUpdateEl=document.getElementById('swUpdate');
let waitingSW=null;
function showSwUpdate(w){waitingSW=w; swUpdateEl.hidden=false;}
// ページ自身の版(X-Shell-Version)を覚え、SSE/ポーリングで届く版と違えばバッジを出す
let shellVer=null; fetch('/',{method:'GET',cache:'no-store',headers:{'Range':'bytes=0-0'}}).then(r=>{shellVer=r.headers.get('X-Shell-Version');}).catch(()=>{});
setInterval(()=>{fetch('/api/push/key',{cache:'no-store'}).then(r=>r.json()).then(k=>{if(k.shell&&shellVer&&k.shell!==shellVer) swUpdateEl.hidden=false;}).catch(()=>{});},60000);
addEventListener('hashchange',()=>{if(location.hash.startsWith('#t=')) openThread(decodeURIComponent(location.hash.slice(3)));});
if('serviceWorker' in navigator){
  // 通知タップ → SW から「このスレを開いて」。ページを開いたままスレ直行
  navigator.serviceWorker.addEventListener('message',e=>{fetch('/api/clientlog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({src:'page',ev:'sw-message',data:JSON.stringify(e.data)})}).catch(()=>{}); if(e.data&&e.data.type==='open'&&e.data.window){openThread(e.data.window);}});
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    pushState();
    // 新しい SW は自動で有効化する(通知の処理系を古いまま残さない)。ページの再読込はバナーのタップ時だけ
    if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    if(reg.waiting&&navigator.serviceWorker.controller) showSwUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller){ showSwUpdate(nw); nw.postMessage({type:'SKIP_WAITING'}); } });
    });
  }).catch(()=>{});
  // controllerchange での勝手な reload はしない。更新はユーザーがバナーをタップしたときだけ
  // バッジのタップ = 再読込(SW 自体は自動で切り替わっているので、HTML を取り直すだけでよい)
  swUpdateEl.addEventListener('click',e=>{e.stopPropagation(); if(waitingSW){try{waitingSW.postMessage({type:'SKIP_WAITING'});}catch(_){}} setTimeout(()=>location.reload(),150);});
  // 新しい SW が制御を奪った瞬間に「更新しました」を一言だけ出す(ループ防止フラグ付き。reload はしない)
  let controllerChangeShown=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(controllerChangeShown) return; controllerChangeShown=true;
    toastEl.className='on ok'; toastEl.querySelector('.t').textContent='新しい版に更新しました'; toastEl.querySelector('.b').textContent=''; delete toastEl.dataset.w;
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>{toastEl.className='';},4000);
  });
}
// ページの版(<meta name=tp-version>)と /api/version を突き合わせ、古ければ1回だけ再読込する(2重発火防止)
(function(){
  const myVer=document.querySelector('meta[name="tp-version"]')?.getAttribute('content')||'';
  let reloaded=false;
  function checkVersion(){
    if(reloaded||!myVer) return;
    fetch('/api/version',{cache:'no-store'}).then(r=>r.json()).then(j=>{
      if(reloaded||!j.version||j.version===myVer) return;
      reloaded=true;
      toastEl.className='on ok'; toastEl.querySelector('.t').textContent='新しい版があります。再読み込みします'; toastEl.querySelector('.b').textContent=''; delete toastEl.dataset.w;
      setTimeout(()=>location.reload(),600);
    }).catch(()=>{});
  }
  checkVersion();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkVersion(); });
})();
pushBtn.addEventListener('click',async e=>{e.stopPropagation();
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){alert('この開き方では通知が使えません。HTTPS の URL をホーム画面に追加して、そこから開いてください');return;}
  if(location.protocol!=='https:'){const k=await (await fetch('/api/push/key')).json(); alert(`通知は HTTPS 側で設定します:\nhttps://${k.host}:${k.port}/\nを Safari で開き「ホーム画面に追加」→ そのアイコンから開いて 🔕 を押してください`);return;}
  const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
  if(sub){const k=await (await fetch('/api/push/key')).json(); const cur={need:'1',done:'2',all:'3'}[k.level]||'2';
    const a=prompt(`通知の範囲を選んでください(現在 ${cur})\n1 = 要対応だけ(承認・選択・信頼確認)\n2 = 完了も\n3 = 停止・消滅も\n0 = 通知をオフ\n9 = 通知の仕組みを作り直す(不調のとき。再登録が要ります)`,cur); if(a===null) return;
    if(a==='9'){try{await fetch('/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}); await sub.unsubscribe();}catch(_){} const regs=await navigator.serviceWorker.getRegistrations(); for(const r of regs){await r.unregister();} alert('作り直しました。再読み込み後に 🔕 を押して通知を登録し直してください'); location.reload(); return;}
    if(a==='0'){await fetch('/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}); await sub.unsubscribe(); pushState(); return;}
    const lv={'1':'need','2':'done','3':'all'}[a]; if(lv) await api('/api/push/level',{level:lv}); return;}
  const perm=await Notification.requestPermission(); if(perm!=='granted'){alert('通知が許可されませんでした');return;}
  const k=await (await fetch('/api/push/key')).json(); if(!k.ok){alert('サーバー側が通知に対応していません');return;}
  sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(k.key)});
  const j=await api('/api/push/subscribe',{subscription:{endpoint:sub.endpoint,keys:{p256dh:b64uFromBuf(sub.getKey('p256dh')),auth:b64uFromBuf(sub.getKey('auth'))},ua:navigator.userAgent}});
  if(j.ok){pushState(); if(confirm('登録しました。テスト通知を送りますか?')) api('/api/push/test',{});}
});
function b64uFromBuf(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

// ================= 添付(写真・ファイル → inbox) =================
const attachments={};   // key('main' or window) -> [{id,name,size,status:'uploading'|'done'|'error',pct,path,error,xhr}]
const fileInput=document.getElementById('file-main');
let attTarget='main';
let attSeq=0;
document.addEventListener('click',e=>{const b=e.target.closest('button.clip'); if(!b) return; e.stopPropagation(); attTarget=b.dataset.att; fileInput.value=''; fileInput.click();},true);
fileInput.addEventListener('change',()=>{const files=[...fileInput.files]; const key=attTarget; files.forEach(f=>uploadFile(key,f));});
function updateSendEnabledFor(key){ if(key==='main') updateSendEnabled(); else updateCardSendEnabled(key); }
function uploadFile(key,f){
  const id='a'+(++attSeq);
  const item={id,name:f.name||'photo.jpg',size:f.size||0,status:'uploading',pct:0,path:null,error:null,xhr:null};
  (attachments[key]=attachments[key]||[]).push(item);
  renderAtt(key); updateSendEnabledFor(key);
  const xhr=new XMLHttpRequest(); item.xhr=xhr;
  xhr.open('POST','/api/upload?name='+encodeURIComponent(item.name));
  xhr.upload.onprogress=e=>{ if(!e.lengthComputable) return; item.pct=Math.round(e.loaded/e.total*100); updateChipProgress(key,id,item.pct); };
  xhr.onload=()=>{
    let j=null; try{j=JSON.parse(xhr.responseText);}catch(err){}
    item.xhr=null;
    if(xhr.status>=200&&xhr.status<300&&j&&j.ok){ item.status='done'; item.path=j.path; item.size=j.size; item.pct=100; }
    else { item.status='error'; item.error=(j&&j.error)||('HTTP '+xhr.status); }
    renderAtt(key); updateSendEnabledFor(key);
  };
  xhr.onerror=()=>{ item.xhr=null; item.status='error'; item.error='通信エラー'; renderAtt(key); updateSendEnabledFor(key); };
  xhr.onabort=()=>{ item.xhr=null; };
  xhr.send(f);
}

const FOOT=/^\s*(⏵⏵|⏸|\?\s*for shortcuts|auto mode|accept edits|plan mode|bypass|─{10,}|❯)/;
const NOISE=/(Tip:|Update installed|Restart to apply|ctrl\+b|esc to interrupt|to run in background|^\s*[^\w\s\-]\s\S+(…\s*\(|\sfor\s\d)|^\s*current work\s*$|\/btw|shift\+tab|← for agents|^\s*\/rc\s*$)/i;
// Claude Code の画面を会話に分解: ❯=自分 / ●=Claude / ● Tool( と ⎿=ツール実行 / 字下げ行=直前の続き
function parseChat(txt){const blocks=[]; let cur=null;
  // 入力欄(最後から2番目の区切り線より後ろ)は会話ではないので落とす
  let lines=txt.split('\n'); const seps=lines.map((l,i)=>/^─{10,}/.test(l.trim())?i:-1).filter(i=>i>=0); if(seps.length>=2) lines=lines.slice(0,seps[seps.length-2]);
  for(const raw of lines){const l=raw.replace(/\s+$/,''); if(!l.trim()||/^─+/.test(l.trim())) continue;
    let m;
    if((m=l.match(/^❯\s+(.*)/))){cur={role:'me',lines:[m[1]],raw:[l]};blocks.push(cur);continue;}
    if(FOOT.test(l)||NOISE.test(l)) continue;
    if(/^\s*[│┌├└┼┬┴┐┤┘]/.test(l)){ if(cur&&cur.role==='table'){cur.lines.push(l);} else {cur={role:'table',lines:[l],raw:[l]};blocks.push(cur);} continue; }
    if(/^(Searched for|Listed|Read \d|Ran \d|Wrote|Edited|User answered)\b/i.test(l.trim())){cur={role:'tool',lines:[l.trim()],raw:[l]};blocks.push(cur);continue;}
    if((m=l.match(/^[●⏺]\s+(.*)/))){const body=m[1]; const isTool=/^[A-Z][A-Za-z]+\(/.test(body)||/^(Reading|Writing|Editing|Searching|Running|Ran|User answered)\b/i.test(body);
      cur={role:isTool?'tool':'re',lines:[body],raw:[l]};blocks.push(cur);continue;}
    if(/^\s*⎿/.test(l)){if(cur&&cur.role==='tool'){cur.lines.push(l.replace(/^\s*⎿\s?/,''));cur.raw.push(l);}else{cur={role:'tool',lines:[l.replace(/^\s*⎿\s?/,'')],raw:[l]};blocks.push(cur);}continue;}
    if(cur){cur.lines.push(l);cur.raw.push(l);}else{cur={role:'re',lines:[l],raw:[l]};blocks.push(cur);}
  }
  return blocks;}
function chatKey(x){return x.role+'\n'+x.lines.join('\n');}
// 道具行(Ran 3 shell commands 等)を標準アプリ風の日本語1行に畳む。展開すると生ログが見える
function toolSeg(seg){seg=seg.trim(); let m;
  if((m=seg.match(/^ran (\d+) shell commands?$/i))) return `${m[1]}件のコマンドを実行し`;
  if((m=seg.match(/^ran (\d+) agents?$/i))) return `${m[1]}件のエージェントを実行し`;
  if((m=seg.match(/^read (\d+) files?$/i))) return `${m[1]}件のファイルを読み`;
  if((m=seg.match(/^listed (\d+) directory$/i))||(m=seg.match(/^listed (\d+) directories$/i))) return `${m[1]}件のフォルダを一覧し`;
  if(/^wrote\b/i.test(seg)) return 'ファイルを作成し';
  if(/^edited\b/i.test(seg)) return 'ファイルを編集し';
  if(/^searched for/i.test(seg)) return '検索し';
  return null;
}
function toolLabel(lines){
  const first=(lines[0]||'').trim();
  if(/^user answered/i.test(first)){
    const items=lines.slice(1).map(l=>l.trim()).filter(l=>/^[·・]/.test(l));
    const parsed=items.map(l=>{const m=l.match(/→\s*(.+)$/); return (m?m[1]:l.replace(/^[·・]\s*/,'')).trim();});
    if(parsed.length) return `質問に回答しました: ${parsed[0].slice(0,26)}${parsed.length>1?` ほか${parsed.length-1}件`:''}`;
    return '質問に回答しました';
  }
  if(/summarized/i.test(first)) return '会話を要約しました';
  const segs=first.split(/,\s*/).map(toolSeg);
  if(segs.length&&segs.every(Boolean)) return segs.join('、')+'ました';
  return 'ツールを実行しました';
}
function toolBlockHTML(lines,wasOpen){
  const label=toolLabel(lines), raw=esc(unwrap(lines).join('\n'));
  return `${esc(label)} <span class="chev">›</span><span class="full" ${wasOpen?'':'hidden'}>${raw}</span>`;
}
// Claude の返答末尾に付く「· summarized」を切り離し、折りたたみ行として別扱いにする
const SUMMARIZED_RE=/\s*[·・]\s*summarized\s*$/i;
function chatBlockHTML(x){
  if(x.role==='table') return renderTable(x.lines);
  if(x.role==='tool') return `<div class="tool" title="タップで展開">${toolBlockHTML(x.lines,false)}</div>`;
  let text=unwrap(x.lines).join('\n'); let summarized=false;
  if(x.role==='re'&&SUMMARIZED_RE.test(text)){text=text.replace(SUMMARIZED_RE,''); summarized=true;}
  const sumHTML=summarized?`<div class="tool sumtag" title="タップで展開">会話を要約しました <span class="chev">›</span><span class="full" hidden>${esc(unwrap(x.lines).join('\n'))}</span></div>`:'';
  return `<div class="${x.role}" data-text="${esc(text)}">${linkify(text)}${x.role==='re'?' <span class="say" style="cursor:pointer;opacity:.5">▶︎</span>':''}<button class=\"copy\" title=\"コピー\">⧉</button>${sumHTML}</div>`;
}
// ブロックの中身だけを差し替える(ノード自体は残す→ .tool.open 等の開閉状態を保つ)
function chatBlockUpdate(el,x){
  if(x.role==='tool'){
    const wasOpen=el.classList.contains('open');
    el.innerHTML=toolBlockHTML(x.lines,wasOpen);
  } else {
    let text=unwrap(x.lines).join('\n'); let summarized=false;
    if(x.role==='re'&&SUMMARIZED_RE.test(text)){text=text.replace(SUMMARIZED_RE,''); summarized=true;}
    el.dataset.text=text;
    const sumHTML=summarized?`<div class="tool sumtag" title="タップで展開">会話を要約しました <span class="chev">›</span><span class="full" hidden>${esc(unwrap(x.lines).join('\n'))}</span></div>`:'';
    el.innerHTML=linkify(text)+(x.role==='re'?' <span class="say" style="cursor:pointer;opacity:.5">▶︎</span>':'')+'<button class="copy" title="コピー">⧉</button>'+sumHTML;
  }
}
// tail(チャットログ)をブロック単位で差分更新する。既存 DOM のキー配列と先頭から比較し、
// 一致する先頭部分は触らず、それ以降だけ削除・追加する。「もっと読む」「.tool.open」は
// 要素のキーで自然に保持される(触らないノードはそのまま)
function renderTail(tailEl,s){
  const w=s.window;
  if(s.full===undefined){tailEl.innerHTML='<div class="none">読み込み中…</div>';return;}
  const full=parseChat(s.full);
  if(!full.length){tailEl.innerHTML='<div class="none">(出力なし)</div>';return;}
  const noneEl=tailEl.querySelector(':scope > .none'); if(noneEl) noneEl.remove();   // 「読み込み中…」等の骨組みを実データに差し替え
  const LIMIT=14; let blocks=full, clipped=false;
  if(!showAll.has(w)&&full.length>LIMIT){blocks=full.slice(-LIMIT); clipped=true;}
  let more=tailEl.querySelector(':scope > button.more');
  if(clipped){
    if(!more){more=document.createElement('button'); more.className='dim more'; more.style.cssText='width:100%;padding:8px'; tailEl.insertBefore(more,tailEl.firstChild);}
    more.dataset.w=w; more.textContent=`↑ もっと読む(あと${full.length-LIMIT}件)`;
  } else if(more){more.remove();}
  let log=tailEl.querySelector(':scope > .chatlog');
  if(!log){log=document.createElement('div'); log.className='chatlog'; tailEl.appendChild(log);}
  const items=blocks.map(x=>({x,key:chatKey(x),html:chatBlockHTML(x)})).filter(it=>it.html);
  const kids=Array.from(log.children);
  const oldKeys=kids.map(k=>k.dataset.key);
  const newKeys=items.map(it=>it.key);
  const n=Math.min(oldKeys.length,newKeys.length); let same=0;
  while(same<n&&oldKeys[same]===newKeys[same]) same++;
  // 最後のブロックだけ内容が伸びたケース(作業中の返答): ノードは残してテキストだけ差し替える
  if(oldKeys.length===newKeys.length&&same===newKeys.length-1&&items.length){
    const node=kids[same], it=items[same];
    if(node&&node.dataset.role===it.x.role&&it.x.role!=='table'){chatBlockUpdate(node,it.x); node.dataset.key=it.key; same=newKeys.length;}
  }
  for(let i=kids.length-1;i>=same;i--) kids[i].remove();
  for(let i=same;i<items.length;i++){
    log.insertAdjacentHTML('beforeend',items[i].html);
    const el=log.lastElementChild; el.dataset.key=items[i].key; el.dataset.role=items[i].x.role;
  }
}
// 罫線の表 → HTML table。セル内の折り返し行(先頭セルが空の行)は前の行に連結
function renderTable(lines){const rows=[]; let cur=null;
  // 行の区切りは ├───┼───┤ の罫線。区切りの間にある複数の │ 行は同じ行の折り返し(セルごとに連結)
  for(const l of lines){const s=l.trim();
    if(/^[┌├└]/.test(s)){ if(cur) rows.push(cur); cur=null; continue; }
    if(!/^│/.test(s)) continue;
    const cells=s.replace(/^│/,'').replace(/│$/,'').split('│').map(c=>c.trim());
    if(!cur){cur=cells;} else {cells.forEach((c,i)=>{ if(c) cur[i]=((cur[i]||'')+(/[A-Za-z0-9)]$/.test(cur[i]||'')&&/^[A-Za-z0-9(]/.test(c)?' ':'')+c); });}
  }
  if(cur) rows.push(cur);
  if(!rows.length) return '';
  const th=rows[0], body=rows.slice(1);
  return `<div class="tbl"><table><tr>${th.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${body.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;}
function lastReply(txt){const b=parseChat(txt).filter(x=>x.role==='re'); return b.length?unwrap(b[b.length-1].lines).join('\n'):'';}
// ~/vault/... の linkify は room(vault)が TP.linkifiers に登録する(段階: vault を公開サンプルの room にする)。
// vault が無効/未読み込みのときは TP.linkifiers が空のままなので、パスはただの文字列として出る。
function linkify(s){let h=esc(s)
  .replace(/(https?:\/\/[^\s<>"']+)/g,u=>{const m=u.match(/#(f|d)=([^\s]+)$/); return m?`<a href="#${m[1]}=${m[2]}">${u}</a>`:`<a href="${u}" target="_blank" rel="noopener">${u}</a>`;});
  for(const fn of TP.linkifiers) h=fn(h);
  return h;}

function kbOpen(){

function syncKb(){
  const vv=window.visualViewport;
  if(!vv){ document.documentElement.style.setProperty('--kb','0px'); return; }
  // innerHeight は場面によってレイアウトの高さ(document.documentElement.clientHeight)より
  // 小さくなることがあり(実機で innerHeight=578/586 に対し clientHeight=762 の記録あり)、
  // そのとき差が負になって Math.max(0,...) で 0 に潰れ、キーボードの補正が効かなくなる。
  // position:fixed が実際に基準にするのはレイアウトの高さなので、そちらを使う
  // (両方取って大きいほうを採る=通常時は innerHeight のままで挙動は変わらない)。
  const layoutH=Math.max(document.documentElement.clientHeight||0, innerHeight||0);

  // iOS はキーボードを閉じる途中の visualViewport を1回だけ通知して、閉じ終わりの
  // resize を落とすことがある(2026-09-24 実測: 07:11:46 に kb=295 を最後に20秒間
  // 無通知のまま入力欄が画面の途中に浮いた)。フォーカスで門番すれば、通知が来ない
  // ままでも浮きっぱなしにならない。
  const kb=kbOpen() ? Math.max(0, Math.round(layoutH - vv.height - vv.offsetTop)) : 0;
  document.documentElement.style.setProperty('--kb', kb+'px');

}

        if(placed.some(p=>rect.x<p.x+p.w&&p.x<rect.x+rect.w&&rect.y<p.y+p.h&&p.y<rect.y+rect.h)) continue;   // 既存の名札と重なるなら不可
        placed.push(rect);
        ctx.fillStyle='hsla(0 0% 100% / .82)'; ctx.textAlign=c.align; ctx.fillText(text, c.x, c.y);
        done=true; break;
      }
      // done===false: どこに置いても重なる/はみ出すので、この名札は描かない
    }
  }
  // Tailscale 端末の点(右下)は2026-09-22の作り直しで撤去。ラベルが無くページャーの点と
  // 見分けが付かず、「それ以外の要素は画面に置かない」に反するため(peers 変数自体は他で未使用)
  }
rafHandle=requestAnimationFrame(frame);
// 描画ループが例外で止まったら 2 秒後に再開(ページ全体は生かす)。二重ループにならないよう rafHandle を経由する
setInterval(()=>{const f=__tp.frames; setTimeout(()=>{if(__tp.frames===f&&!document.hidden){__tp.errors.push('frame loop stalled, restart'); rafHandle=null; try{ensureAnimating();}catch(e){}}},1500);},4000);
// スレを閉じた・タブが前面に来た・bfcache から復元された、のいずれでも絵を確実に再開させる
document.addEventListener('visibilitychange',()=>{if(!document.hidden) ensureAnimating();});
addEventListener('pageshow',()=>ensureAnimating());
// デバッグ: タイトルを3回タップで状態を表示
let taps=0,tapT=0; document.getElementById('homeTtl').addEventListener('click',e=>{if(e.target.tagName==='SPAN'&&e.target.id!=='up')return; const n=Date.now(); taps=(n-tapT<600)?taps+1:1; tapT=n; if(taps>=3){taps=0;
  const r=cv.getBoundingClientRect();
  alert(`frames ${__tp.frames}\ncanvas ${cv.width}x${cv.height} css ${r.width.toFixed(0)}x${r.height.toFixed(0)} @${r.top.toFixed(0)}\nW/H ${W}x${H} dpr ${devicePixelRatio}\npulse ${pulseEl.clientWidth}x${pulseEl.clientHeight}\nsessions ${sessions.length} standalone=${matchMedia('(display-mode: standalone)').matches}\nerrors: ${__tp.errors.slice(-3).join(' / ')||'none'}`);}});

// ================= スレ→ホームの戻るスワイプ(指に追従・2026-09-22 指追従版) =================
// 除外ロジック(noSwipe/swipeOverlayOpen)は /plan /workout /note の3ページと揃えてある。
// ホーム側の左右スワイプ(/plan への移動)は同日の判断で撤去。⋯メニューから行けるため。
(function(){
var sx=0, sy=0, st=0, ok=false;      // touchstart 開始点・時刻・対象内かどうか
var deciding=false;                   // 方向未確定(最初の touchmove 待ち)
var dragging=false;                   // 横ジェスチャとして確定し、指に追従中
var curDx=0, SWW=0, pts=[];
function noSwipe(el){
  for (var n = el; n && n !== document.body; n = n.parentElement) {
    if (n.matches && n.matches('textarea,input,select,[data-noswipe]')) return true;
    var ov = getComputedStyle(n).overflowX;
    if ((ov === 'auto' || ov === 'scroll') && n.scrollWidth > n.clientWidth) return true;
  }
  return false;
}
// .tp-overlay は全画面オーバーレイの共通印(#blobview に付けてある。vault の #files は home.js が
// 自分で作るときに同じクラスを付ける)。room が全画面オーバーレイを足すときはこのクラスを付けるだけでよい。
function swipeOverlayOpen(){return !!document.querySelector('.menu.on, #confirm.on, .tp-overlay.on');}
// 本文を範囲選択しているか(2026-09-22)。iOS の選択ハンドルは**ネイティブ部品で DOM 要素ではない**ため、
// ハンドルを掴んで動かしても e.target は下のテキストの要素になり、noSwipe() の除外をすり抜ける。
// 結果、選択範囲を広げようとするたびにスレが滑っていた(実機スクショ IMG_5842)。
// 始動時だけでなく touchmove の途中でも見る。長押し→選択に入る流れがあり、始動時は空のことがある。
function hasSelection(){
  try { var s = window.getSelection(); return !!s && !s.isCollapsed && String(s).length > 0; }
  catch (e) { return false; }
}
function velocity(){   // 直近の touchmove から px/ms を求める(pts は最大5点、古いものから捨てる)
  if (pts.length < 2) return 0;
  var a = pts[0], b = pts[pts.length-1], dt = b.t - a.t;
  return dt > 0 ? (b.x - a.x) / dt : 0;
}
function beginDrag(){
  dragging = true;
  threadEl.style.transition = 'none';
  homeEl.style.display = 'flex';   // ドラッグ中だけホームを裏に見せる
  homeEl.style.zIndex = '0';
  threadEl.style.zIndex = '1';
  // スライド中はホーム側の入力欄を出さない(2026-09-22)。出すと、正しく戻るときも毎回
  // 「Main へ」と「Main に送る」が並んで見え、どちらに送られるか分からなくなる。
  // 「入力欄は同時に1つ」は最初に決めた原則なので、遷移中も守る。
  if (composeEl) composeEl.style.visibility = 'hidden';
}
function applyDrag(dx){
  curDx = dx;
  var shown = dx >= 0 ? dx : dx * 0.2;          // 左(戻る方向でない)は強いラバーバンド
  if (shown > SWW) shown = SWW + (shown - SWW) * 0.2;   // 右も画面幅を超えたら抵抗
  threadEl.style.transform = 'translateX(' + shown + 'px)';
}
function finishDrag(commit){
  threadEl.style.transition = 'transform .22s cubic-bezier(.2,.7,.3,1)';
  threadEl.style.transform = 'translateX(' + (commit ? '100%' : '0') + ')';
  var done = false;
  function cleanup(){
    if (done) return; done = true;
    threadEl.removeEventListener('transitionend', onEnd);
    threadEl.style.transition = '';
    threadEl.style.transform = '';
    threadEl.style.zIndex = '';
    homeEl.style.display = '';
    homeEl.style.zIndex = '';
    if (composeEl) composeEl.style.visibility = '';
    if (commit) closeThread();
  }
  function onEnd(ev){ if (ev.target === threadEl && ev.propertyName === 'transform') cleanup(); }
  threadEl.addEventListener('transitionend', onEnd);
  setTimeout(cleanup, 320);   // transitionend が来ない場合の保険
}
document.addEventListener('touchstart', function(e){
  // スレが開いているときだけ武装する(ホームでは何もしない=左右どちらに払っても無反応)
  ok = e.touches.length === 1 && threadEl.classList.contains('on') && !swipeOverlayOpen()
       && !hasSelection() && !noSwipe(e.target);
  dragging = false; deciding = false; curDx = 0; pts = [];
  if (!ok) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  deciding = true; SWW = innerWidth; pts = [{x: sx, t: st}];
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if (!ok) return;
  var t = e.touches && e.touches[0]; if (!t) return;
  var dx = t.clientX - sx, dy = t.clientY - sy;
  if (deciding){
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
      deciding = false; beginDrag();
    } else if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)){
      // 縦が先に勝った: このジェスチャは捨てる(会話の縦スクロールを邪魔しない)
      deciding = false; ok = false; return;
    } else {
      return;   // まだ判定できない
    }
  }
  if (!dragging) return;
  // 途中で選択が始まったら取り消して元の位置に戻す(長押し→選択の流れは始動時には空なので、
  // touchstart の判定だけでは足りない)
  if (hasSelection()){ ok = false; dragging = false; finishDrag(false); return; }
  e.preventDefault();
  applyDrag(dx);
  pts.push({x: t.clientX, t: Date.now()});
  while (pts.length > 5) pts.shift();
}, {passive:false});
document.addEventListener('touchend', function(e){
  if (!ok) return; ok = false; deciding = false;
  if (!dragging) return;
  dragging = false;
  var t = e.changedTouches && e.changedTouches[0];
  var dx = t ? (t.clientX - sx) : curDx;
  var vx = velocity();
  var commit = dx > SWW * 0.35 || (vx > 0.5 && dx > 20);
  finishDrag(commit);
}, {passive:true});
document.addEventListener('touchcancel', function(){
  ok = false; deciding = false;
  if (dragging){ dragging = false; finishDrag(false); }
}, {passive:true});
})();
})();
</script>
</body>
